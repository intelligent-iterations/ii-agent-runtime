# Sample deploy workflow for acme/functions. The checker reads it as data; it is never run.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      project:
        type: choice
        options: [acme-functions-dev, acme-functions-prod]
permissions:
  contents: read
jobs:
  functions:
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ${{ inputs.project || (github.ref == 'refs/heads/main' && 'acme-functions-prod' || 'acme-functions-dev') }}
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/123456789/locations/global/workloadIdentityPools/github/providers/github
          service_account: deployer@${{ env.PROJECT }}.iam.gserviceaccount.com
      - run: ./scripts/deploy-functions.sh
  hosting:
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.HOSTING_SA_KEY }}
      - run: npx firebase-tools deploy --only hosting
